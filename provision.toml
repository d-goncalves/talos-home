# ─────────────────────────────────────────────────────────────────────────────
#  All configuration for this cluster.
#
#  This file is committed. It contains no secrets: those live in 1Password and
#  are read directly by Terraform (see talos/terraform/secrets.tf) and by External
#  Secrets Operator in-cluster.
#
#  Apply changes with:
#      ./provision sync     regenerate the generated files
#      ./provision apply    push infrastructure changes
#      git commit && push Flux picks up app changes
# ─────────────────────────────────────────────────────────────────────────────

[cluster]
name               = "talos-home"
talos_version      = "v1.13.2"
kubernetes_version = "v1.36.0"
tailnet_domain     = "<tailnet>.ts.net"

[proxmox]
endpoint         = "https://192.168.1.10:8006/"
node_name        = "pve"
ssh_username     = "root"
iso_datastore_id = "local"
insecure         = true

[network]
gateway       = "192.168.1.1"
subnet_prefix = 24
# Point at the router or the Pi-hole CT, never at 100.100.100.100 (MagicDNS):
# a host that is not on the tailnet gets hanging lookups on every query.
nameservers = ["192.168.1.1"]
# Advertised to the tailnet as a subnet route.
lan_subnet = "192.168.1.0/24"

[nas]
# UniFi UNAS Pro. Not managed by Terraform — no UniFi API exposes NFS shares —
# but recorded here so `./provision preflight` can verify the node is allowed
# to mount, and so bootstrap does not have to prompt for these.
#
# ⚠️  Exports are allow-listed per client IP. A node whose IP is not on the
#     list is denied every share and every NFS-backed app fails to mount.
#     Check with: showmount -e <ip>
ip        = "192.168.1.12"
data_path = "/volume/7c4b253e-2985-4fe6-89f5-91038758515f/.srv/.unifi-drive/media/.data"

[tailscale]
enabled = true
# Must be listed under tagOwners in the tailnet ACL.
tags = ["tag:k8s"]

[unifi]
# Manages the static DHCP reservation only. UNAS NFS shares are not exposed by
# any UniFi API, so exports stay a one-time manual step in the UNAS UI.
enabled = false
api_url = "https://192.168.1.1"
site    = "default"

# ─────────────────────────────────────────────────────────────────────────────
#  Nodes
#
#  ⚠️  The running cluster is Proxmox VM 100. The vm_id below is deliberately
#      free so a first apply cannot touch it.
#
#  Written for N nodes, expected to run with one: the Proxmox host has 15 GiB
#  and 4 cores in total, which is not enough for a three-node control plane.
#
#  ⚠️  VM 100 uses ballooning, so starting a second VM makes the host reclaim
#      memory from it. A 3 GiB test node dropped VM 100 from 9924 to 7876 MiB
#      and its kube-apiserver stopped serving. Do not run both at once.
# ─────────────────────────────────────────────────────────────────────────────

[nodes.talos-cp-01]
vm_id        = 110
ip           = "192.168.1.21"
mac_address  = "AA:BB:CC:DD:EE:FF"
machine_type = "controlplane"

cpu_cores = 2
# MiB. memory_floating > 0 enables ballooning, which is how the guest ended up
# seeing ~8 GiB of a 10 GiB VM and thrashing. Leave it at 0.
memory_dedicated = 10240
memory_floating  = 0

disk_size    = 64
datastore_id = "local-lvm"
install_disk = "/dev/sda"
interface    = "ens18"
bridge       = "vmbr0"

# ─────────────────────────────────────────────────────────────────────────────
#  Apps
#
#  false removes the app from the generated kustomization. Flux prunes its
#  Deployments, StatefulSets, Services and Ingresses, and the CPU and memory
#  come back.
#
#  Namespaces, PVCs and PVs are annotated prune-exempt, so data survives and
#  flipping an app back to true reattaches the same volumes.
#
#  Run `provision apps protect` once before your first disable: Flux reads that
#  annotation from the object in the cluster, not from git.
# ─────────────────────────────────────────────────────────────────────────────

[apps]
gitea          = true   # GitOps source of truth — Flux reads from it. Leave on.
immich         = true   # heaviest app here: server + postgres + valkey
adventurelog   = true
monitoring     = false   # Grafana/Loki/Prometheus — first to drop when tight
servarr        = true
outline        = true
audiobookshelf = true
actualbudget   = true
wallos         = true
homebox        = true
homepage       = true
ntfy           = true
uptime-kuma    = true
watchyourlan   = true
bentopdf       = true
it-tools       = true
librespeed     = true

# ─────────────────────────────────────────────────────────────────────────────
#  SANDBOX
#
#  A throwaway Ubuntu VM for testing packages you do not trust. Deliberately
#  not managed by Terraform: it is created and destroyed several times an hour,
#  so there is nothing worth keeping state for — and sharing no state with the
#  homelab means a mistake here can never plan a change against the cluster.
#
#  Budget: the host has 15.5 GiB and PVE itself takes ~1.9 GiB. With the
#  cluster on 10 GiB this leaves room for one 2 GiB sandbox and ~3 GiB spare.
#  Raising either number past that oversubscribes the host, and with ballooning
#  off there is no give — the OOM killer takes the largest VM, which is Talos.
# ─────────────────────────────────────────────────────────────────────────────

[sandbox]
vm_id        = 120
# Built once by `provision sandbox template`, then cloned per run.
template_id  = 9000
# Must sit inside the 192.168.1.20-29 range reserved for these machines.
# .21 is the Talos node.
ip           = "192.168.1.22"
memory       = 2048
cpu_cores    = 2
disk_size    = 20
datastore_id = "local-lvm"
bridge       = "vmbr0"
username     = "lab"
# Ubuntu's cloud image. `current` tracks the latest point release of 24.04 LTS.
image_url    = "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img"

# ─────────────────────────────────────────────────────────────────────────────
#  Pi-hole
# ─────────────────────────────────────────────────────────────────────────────
#
# DNS for the tailnet, not just the LAN: the container joins Tailscale and its
# tailnet address is what devices resolve against — see tailnet_nameservers
# below. That is also why it is never recreated. A rebuilt container gets a new
# Tailscale identity, and DNS breaks on every device until the nameserver list
# is updated to match.
#
# Terraform declares the container; Ansible configures what runs inside it:
#     ./provision pihole apply
[pihole]
enabled = true

# One entry per Pi-hole. The list is a group, so a second instance is a second
# entry here and nothing else — both converge on the same declared config, so
# Ansible is the sync mechanism and no replication tool is needed.
#
# Two would remove the "DNS is down while I patch it" window. On a single
# Proxmox host it is not yet HA against the host itself.
[[pihole.hosts]]
name    = "pihole"
vmid    = 101
# Reachable over the tailnet, so Ansible does not depend on the LAN address.
ansible_host = "pihole.<tailnet>.ts.net"
# The address devices actually resolve against — Terraform publishes this as
# the tailnet nameserver. Stable for the life of the container's Tailscale
# identity, which is the reason the container is never recreated.
tailscale_ip = "100.78.68.92"
# Must sit inside the 192.168.1.20-29 range reserved for these machines.
ip      = "192.168.1.23"
memory  = 512
swap    = 512
cores   = 1
