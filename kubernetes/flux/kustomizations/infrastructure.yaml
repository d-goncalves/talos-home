apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/infrastructure
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Every HelmRelease under infrastructure resolves its chart through one of
  # those sources, so they have to be reconciled first.
  dependsOn:
    - name: repositories
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-vars
