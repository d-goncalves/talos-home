# local-path-provisioner, which was installed by hand and recorded nowhere.
# Without it a rebuilt cluster leaves every local-path PVC Pending — including
# Immich's valkey cache, which stops immich-server from starting at all.
#
# Only disposable data belongs here: Prometheus metrics, Loki logs and caches.
# Anything worth keeping goes on NFS, which `./provision apps storage` enforces.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-path-provisioner
  namespace: local-path-storage
spec:
  interval: 1h
  chart:
    spec:
      # Path within the GitRepository, not a chart name: the version comes from
      # the tag that source is pinned to, so there is no `version` here.
      chart: ./deploy/chart/local-path-provisioner
      sourceRef:
        kind: GitRepository
        name: local-path-provisioner
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    storageClass:
      create: true
      defaultClass: true
      name: local-path
      reclaimPolicy: Delete
    # Talos mounts /var as writable ephemeral storage; the default
    # /opt/local-path-provisioner is read-only on a Talos node.
    nodePathMap:
      - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
        paths:
          - /var/mnt/local-path-provisioner
