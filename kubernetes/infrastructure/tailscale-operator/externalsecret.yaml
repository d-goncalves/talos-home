# The Tailscale operator's OAuth client. This existed only as a hand-created
# Secret on the live cluster and was recorded nowhere, so a rebuilt cluster got
# an operator stuck in ContainerCreating and no ingress at all — every
# *.ts.net URL would have been unreachable.
#
# The chart expects a Secret named operator-oauth with keys client_id and
# client_secret; the 1Password item stores them as username and password, so
# they are remapped through a template.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: operator-oauth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        client_id: "{{ .username }}"
        client_secret: "{{ .password }}"
  dataFrom:
    - extract:
        key: <item-id> # Tailscale Talos in Server Infrastructure vault
