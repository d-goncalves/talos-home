apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: servarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      initContainers:
        - name: init-config
          image: alpine
          # The API key is written by the shell at runtime from the mounted
          # secret, so it is escaped as $${...}: Flux substitutes $$ down to a
          # single $ and otherwise claims every ${...} it sees.
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /config
              if [ ! -f /config/config.xml ]; then
                cat > /config/config.xml <<XML
              <Config>
                <InstanceName>Prowlarr</InstanceName>
                <ApiKey>$${PROWLARR_API_KEY}</ApiKey>
                <AuthenticationMethod>Forms</AuthenticationMethod>
                <AuthenticationRequired>Enabled</AuthenticationRequired>
                <Branch>master</Branch>
                <LogLevel>info</LogLevel>
                <Port>9696</Port>
                <UrlBase></UrlBase>
              </Config>
              XML
              fi
          env:
            - name: PROWLARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: servarr-secrets
                  key: PROWLARR_API_KEY
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:2.5.2.5491-ls156
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Lisbon
          ports:
            - containerPort: 9696
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: prowlarr-config
---
apiVersion: v1
kind: Service
metadata:
  name: prowlarr
  namespace: servarr
spec:
  selector:
    app: prowlarr
  ports:
    - port: 9696
