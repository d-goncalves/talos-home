apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homebox
  namespace: homebox
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: homebox-secret
    creationPolicy: Owner
    # Retain: the pepper must survive a resync gap. Rotating it invalidates
    # every API key Homebox has ever issued.
    deletionPolicy: Retain
  data:
    - secretKey: api_key_pepper
      remoteRef:
        key: Homebox - talos-home
        property: api_key_pepper
