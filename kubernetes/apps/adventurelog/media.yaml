# Serves uploaded images so the backend does not have to.
#
# Django refuses to serve MEDIA_URL when DEBUG is off, by design — it wants a
# real web server doing it. The app had been getting away with DEBUG=True,
# which also renders full tracebacks (locals, settings, SQL) to anyone who
# triggers an error. This exists so DEBUG can be turned off without photos
# turning into 404s.
#
# Static files need no equivalent: WhiteNoise is already in the middleware and
# serves /static regardless of DEBUG.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adventurelog-media
  namespace: adventurelog
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: adventurelog-media
  template:
    metadata:
      labels:
        app: adventurelog-media
    spec:
      securityContext:
        # The NAS squashes everything to 977:988 and /code/media is mode 2770,
        # so "others" cannot even traverse it. Without this the container reads
        # nothing. fsGroup is ignored by NFS but supplementalGroups is not.
        runAsUser: 977
        runAsGroup: 988
        fsGroup: 988
        supplementalGroups: [988]
      containers:
        - name: nginx
          # The unprivileged image listens on 8080 and keeps its temp paths
          # under /tmp, so it runs happily as an arbitrary uid.
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: media
              # Requests arrive as /media/<path>, and nginx's default root is
              # /usr/share/nginx/html, so the volume goes at .../html/media.
              mountPath: /usr/share/nginx/html/media
              readOnly: true
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          readinessProbe:
            # Probes the image's own index page, not /media/. That is a
            # directory, and with autoindex off nginx answers 403 — correct
            # behaviour, but it reads as an unhealthy pod forever.
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: adventurelog-media
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: adventurelog-media
  namespace: adventurelog
spec:
  selector:
    app: adventurelog-media
  ports:
    - name: http
      port: 8080
      targetPort: 8080
