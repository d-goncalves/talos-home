apiVersion: apps/v1
kind: Deployment
metadata:
  name: adventurelog-backend
  namespace: adventurelog
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: adventurelog-backend
  template:
    metadata:
      labels:
        app: adventurelog-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/seanmorley15/adventurelog-backend:latest
          env:
            - name: PGHOST
              value: adventurelog-postgres
            - name: PGDATABASE
              value: adventurelog
            - name: PGUSER
              value: adventurelog
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: adventurelog-secrets
                  key: POSTGRES_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: adventurelog-secrets
                  key: SECRET_KEY
            # SITE_URL is what settings.py reads: without it
            # CSRF_TRUSTED_ORIGINS falls back to http://localhost, so Django
            # rejects every login POST from the real hostname — which the UI
            # reports as "invalid credentials".
            - name: SITE_URL
              value: https://adventurelog.${TAILNET_DOMAIN}
            # PUBLIC_URL is NOT dead despite the rename. The Immich integration
            # still reads it straight from os.environ to build the image URLs it
            # hands the browser, and falls back to http://127.0.0.1:8000 —
            # which resolves to the visitor's own machine, not the server. Both
            # names are needed; they are read by different code.
            - name: PUBLIC_URL
              value: https://adventurelog.${TAILNET_DOMAIN}
            - name: FRONTEND_URL
              value: https://adventurelog.${TAILNET_DOMAIN}
            # settings.py defaults DEBUG to true, which renders full tracebacks
            # — locals, settings names, SQL — to whoever triggers an error.
            # Media is served by adventurelog-media now, so nothing depends on
            # DEBUG being on; static files come from WhiteNoise either way.
            - name: DEBUG
              value: "false"
            - name: DJANGO_ADMIN_USERNAME
              value: admin
            - name: DJANGO_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: adventurelog-secrets
                  key: DJANGO_ADMIN_PASSWORD
            - name: DJANGO_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: adventurelog-secrets
                  key: DJANGO_ADMIN_EMAIL
          volumeMounts:
            - name: media
              mountPath: /code/media
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: adventurelog-media
---
apiVersion: v1
kind: Service
metadata:
  name: adventurelog-backend
  namespace: adventurelog
spec:
  selector:
    app: adventurelog-backend
  ports:
    - port: 8000
