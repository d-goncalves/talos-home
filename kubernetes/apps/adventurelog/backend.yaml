apiVersion: apps/v1
kind: Deployment
metadata:
  name: adventurelog-backend
  namespace: adventurelog
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: adventurelog-backend
  template:
    metadata:
      labels:
        app: adventurelog-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/seanmorley15/adventurelog-backend:latest
          env:
            - name: PGHOST
              value: adventurelog-postgres
            - name: PGDATABASE
              value: adventurelog
            - name: PGUSER
              value: adventurelog
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: adventurelog-secrets
                  key: POSTGRES_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: adventurelog-secrets
                  key: SECRET_KEY
            # SITE_URL, not PUBLIC_URL: upstream renamed it, and the old name
            # is read by nothing. Without it CSRF_TRUSTED_ORIGINS falls back to
            # http://localhost, so Django rejects every login POST coming from
            # the real hostname — which surfaces in the UI as "invalid
            # credentials" and sends you hunting for a password problem.
            - name: SITE_URL
              value: https://adventurelog.${TAILNET_DOMAIN}
            - name: FRONTEND_URL
              value: https://adventurelog.${TAILNET_DOMAIN}
            - name: DJANGO_ADMIN_USERNAME
              value: admin
            - name: DJANGO_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: adventurelog-secrets
                  key: DJANGO_ADMIN_PASSWORD
            - name: DJANGO_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: adventurelog-secrets
                  key: DJANGO_ADMIN_EMAIL
          volumeMounts:
            - name: media
              mountPath: /code/media
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: adventurelog-media
---
apiVersion: v1
kind: Service
metadata:
  name: adventurelog-backend
  namespace: adventurelog
spec:
  selector:
    app: adventurelog-backend
  ports:
    - port: 8000
