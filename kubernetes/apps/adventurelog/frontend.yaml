apiVersion: apps/v1
kind: Deployment
metadata:
  name: adventurelog-frontend
  namespace: adventurelog
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: adventurelog-frontend
  template:
    metadata:
      labels:
        app: adventurelog-frontend
    spec:
      containers:
        - name: frontend
          # Pinned by digest for the same reason as the backend, which it is
          # released alongside and must stay in step with.
          image: ghcr.io/seanmorley15/adventurelog-frontend:latest@sha256:31b8bd7d7528485046bb55559b6d3343d693960de4d62ff39cab492e48093fb0
          env:
            - name: ORIGIN
              value: https://adventurelog.${TAILNET_DOMAIN}
            - name: PUBLIC_SERVER_URL
              value: http://adventurelog-backend:8000
---
apiVersion: v1
kind: Service
metadata:
  name: adventurelog-frontend
  namespace: adventurelog
spec:
  selector:
    app: adventurelog-frontend
  ports:
    - port: 3000
