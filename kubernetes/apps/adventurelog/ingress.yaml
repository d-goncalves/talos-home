apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adventurelog
  namespace: adventurelog
  annotations:
    tailscale.com/funnel: "false"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "AdventureLog"
    gethomepage.dev/description: "Travel tracker"
    gethomepage.dev/group: "Productivity"
    gethomepage.dev/icon: "adventurelog"
    gethomepage.dev/href: "https://adventurelog.${TAILNET_DOMAIN}"
    gethomepage.dev/pod-selector: "app=adventurelog-frontend"
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          # Uploaded images are written by the backend and served by it, but
          # the frontend only proxies /api and /auth — so a stored photo came
          # back as a SvelteKit 404 even though the file was on the NFS and the
          # backend served it happily on :8000. Must stay ahead of the catch-all.
          - path: /media
            pathType: Prefix
            backend:
              service:
                name: adventurelog-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: adventurelog-frontend
                port:
                  number: 3000
  tls:
    - hosts:
        - adventurelog
