# Ansible configures what runs *inside* the Pi-hole containers. Terraform
# declares the containers themselves — see terraform/pihole.tf.
[defaults]
inventory            = inventory.yml
roles_path           = roles
filter_plugins       = filter_plugins
host_key_checking    = True
# community.general.yaml was removed in that collection's v12; the same
# output now comes from ansible-core's default callback.
result_format        = yaml
# The inventory is generated, so a stale retry file points at hosts that may no
# longer be declared.
retry_files_enabled  = False
interpreter_python   = auto_silent

[ssh_connection]
pipelining = True
