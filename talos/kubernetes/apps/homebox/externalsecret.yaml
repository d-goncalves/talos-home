apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homebox
  namespace: homebox
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: homebox-secret
    creationPolicy: Owner
    # Retain: the pepper must survive a resync gap. Rotating it invalidates
    # every API key Homebox has ever issued.
    deletionPolicy: Retain
  dataFrom:
    # Referenced by item ID, not title, like every other ExternalSecret here.
    # The onepasswordSDK provider rejects a bare title in a data[].remoteRef
    # (it wants an op://vault/item/field URI), and an ID is unambiguous even
    # when several items share a title.
    - extract:
        key: <item-id>  # Homebox - talos-home in Server Infrastructure vault
        # Fields: api_key_pepper
