[project]
name = "provision"
version = "0.1.0"
description = "Provisioning CLI for the talos-home cluster"
# tomllib is stdlib from 3.11, so the CLI has exactly one dependency.
requires-python = ">=3.11"
dependencies = ["click>=8.1"]

[project.scripts]
provision = "provision.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provision"]
