[project]
name = "provision"
version = "0.1.0"
description = "Provisioning CLI for the talos-home cluster"
# tomllib is stdlib from 3.11, so the CLI has exactly one dependency.
requires-python = ">=3.11"
# Upper bound deliberate: this is a disaster-recovery tool that pip-installs on
# first run, so an unpinned major release must not be able to break recovery.
dependencies = ["click>=8.1,<9"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "PyYAML>=6.0", "pyflakes>=3.0"]

[project.scripts]
provision = "provision.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provision"]
