# CI on the Gitea runner — the source of truth, rather than the GitHub mirror.
#
# Jobs run inside the act_runner container (Alpine), because Talos has no
# Docker daemon for container jobs. That means no `actions/checkout` (it needs
# node) and no preinstalled toolchain, so this clones with git and apk-adds
# what it uses. Installs persist for the life of the runner pod, so only the
# first run after a restart pays for them.
name: CI

on:
  push:
    # renovate/** matters: automerge waits for a green run on the branch it
    # creates, so without this every bump sits there forever looking stuck.
    branches: [master, "renovate/**"]
  workflow_dispatch:

jobs:
  checks:
    runs-on: self-hosted
    steps:
      - name: Tooling
        run: |
          # --upgrade matters: the image ships an expat older than the python3
          # apk installs, and pyexpat then fails to relocate at import time —
          # which surfaces as a pip traceback rather than anything obvious.
          apk add --no-cache --upgrade expat python3 py3-pip git unzip >/dev/null
          # kubectl is not in Alpine's repos, and the storage audit and the
          # kustomize builds both need it. Skipped when already present, so
          # only the first run after a runner restart pays for it.
          if ! command -v kubectl >/dev/null; then
            wget -qO /usr/local/bin/kubectl \
              https://dl.k8s.io/release/v1.36.0/bin/linux/amd64/kubectl
            chmod +x /usr/local/bin/kubectl
          fi
          # Same deal for terraform. Installed rather than skipped-when-missing:
          # a check that quietly no-ops is worse than no check, because it
          # reports green either way.
          if ! command -v terraform >/dev/null; then
            wget -qO /tmp/tf.zip \
              https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip
            unzip -qo /tmp/tf.zip -d /usr/local/bin && rm -f /tmp/tf.zip
            chmod +x /usr/local/bin/terraform
          fi
          # No pipe to head here: kubectl gets SIGPIPE when head closes the
          # stream and the step dies with exit 141.
          python3 --version
          kubectl version --client=true >/dev/null && echo "kubectl ok"
          terraform version >/dev/null && echo "terraform ok"

      - name: Clone
        run: |
          # The runner reuses its workdir between jobs, so a leftover repo/
          # from the previous run makes clone fail outright.
          rm -rf repo
          # --branch matters: a shallow clone of the default branch does not
          # contain commits on renovate/*, so checking the triggering SHA fails
          # with "unable to read tree".
          git clone --quiet --depth 50 --branch "$GITHUB_REF_NAME" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout --quiet "$GITHUB_SHA" 2>/dev/null \
            || echo "using branch tip $(git rev-parse --short HEAD)"

      - name: Lint and tests
        run: |
          cd repo
          python3 -m venv .ci && . .ci/bin/activate
          pip install -q -e ./cli pyflakes pytest PyYAML
          python -m pyflakes cli/src/provision/
          pytest cli/tests -q

      - name: Generated files are in sync
        run: |
          cd repo && . .ci/bin/activate
          python -m provision homelab sync
          for f in homelab/kubernetes/apps/kustomization.yaml pihole/ansible/inventory.yml; do
            git diff --quiet -- "$f" || {
              echo "::error::$f is out of date."
              echo "Run './provision homelab sync' and commit the result."
              git --no-pager diff -- "$f"
              exit 1
            }
          done

      - name: Persistent data survives a rebuild
        run: |
          cd repo && . .ci/bin/activate
          python -m provision homelab apps storage

      - name: Nothing under kubernetes/ is untracked
        run: |
          cd repo
          untracked="$(git ls-files --others --exclude-standard homelab/kubernetes/)"
          if [ -n "$untracked" ]; then
            echo "$untracked"
            echo "::error::untracked files under homelab/kubernetes/ — commit them or gitignore them"
            exit 1
          fi

      - name: Disabled apps still build
        run: |
          # An app switched off in provision.toml is left out of the generated
          # kustomization, so the build above never touches it — but Renovate
          # still proposes updates to its manifests, and those would merge with
          # nothing having parsed them.
          #
          # Building each disabled app on its own keeps that honest, and keeps
          # its charts current enough that re-enabling stays a toggle rather
          # than a migration project.
          cd repo && . .ci/bin/activate
          for app in $(python -m provision homelab apps list 2>/dev/null \
                       | awk '/off/ {print $2}'); do
            dir="homelab/kubernetes/apps/$app"
            [ -f "$dir/kustomization.yaml" ] || continue
            echo "building disabled app: $app"
            kubectl kustomize "$dir" >/dev/null
          done

      - name: Kustomize builds
        run: |
          cd repo
          for overlay in homelab/kubernetes/apps homelab/kubernetes/infrastructure homelab/kubernetes/flux; do
            echo "building $overlay"
            kubectl kustomize "$overlay" >/dev/null
          done

      - name: Terraform roots are well-formed
        run: |
          # Both roots, because they are separate states: a syntax error in the
          # Pi-hole one would otherwise only surface the next time DNS needed
          # changing, which is the worst moment to discover it.
          #
          # fmt and a parse-only validate. `validate` normally wants `init`, and
          # init here would download providers and reach 1Password for nothing —
          # the credentials are not needed to check that the HCL is sane.
          cd repo
          terraform fmt -check -recursive homelab/terraform pihole/terraform
          for root in homelab/terraform pihole/terraform; do
            terraform -chdir="$root" init -backend=false -input=false >/dev/null
            terraform -chdir="$root" validate
          done

      - name: Flux can substitute every variable
        run: |
          # The step above proves nothing about substitution: `kubectl
          # kustomize` does none, so a manifest that takes the whole apps
          # Kustomization down still builds clean here. That is exactly how a
          # green commit broke the cluster during the v2.9 upgrade.
          cd repo && . .ci/bin/activate
          python -m provision homelab apps vars

