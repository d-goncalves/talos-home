---
# Converge every declared Pi-hole on the config in group_vars/pihole.yml.
#
# Run with `./provision homelab pihole apply`, which reads the admin password
# out of 1Password and passes it in. Running ansible-playbook directly works
# too, as long as pihole_web_password is supplied.
- name: Configure Pi-hole
  hosts: piholes
  gather_facts: true
  roles:
    - pihole
