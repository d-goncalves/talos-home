apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 10m
  path: ./homelab/kubernetes/infrastructure
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Every HelmRelease here resolves its chart through a source under
  # kubernetes/flux/repositories, which flux-system owns, so that has to
  # reconcile first.
  dependsOn:
    - name: flux-system
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-vars
