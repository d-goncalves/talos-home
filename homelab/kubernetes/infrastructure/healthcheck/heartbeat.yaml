# Heartbeat to an external dead-man's switch. Uptime Kuma dies with the cluster
# it watches, so it cannot report the cluster being down; this calls out every
# five minutes and healthchecks.io alerts when the calls stop. Nothing reaches
# in, which is what makes it work with a tailnet-only setup.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: healthcheck-ping
  namespace: kube-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: healthcheck-ping
  data:
    # Only the ping URL, never the API key on the same item — the cluster
    # should not be able to reconfigure its own watchdog.
    #
    # <item-id>/<field>, not the bare id `dataFrom: extract` takes: the store
    # pins the vault, so the provider builds op://<vault>/<key> itself.
    - secretKey: ping_url
      remoteRef:
        key: <item-id>/ping_url # Healthchecks.io - talos-home
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: healthcheck-heartbeat
  namespace: kube-system
spec:
  schedule: "*/5 * * * *"
  # A missed beat is not worth queueing for: grace is 15 minutes.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 900
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
          containers:
            - name: ping
              image: curlimages/curl:8.22.0
              args:
                - --fail
                - --silent
                - --show-error
                - --max-time
                - "20"
                - --retry
                - "3"
                - --retry-delay
                - "5"
                - $(PING_URL)
              env:
                - name: PING_URL
                  valueFrom:
                    secretKeyRef:
                      name: healthcheck-ping
                      key: ping_url
              resources:
                requests:
                  cpu: 5m
                  memory: 16Mi
                limits:
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
