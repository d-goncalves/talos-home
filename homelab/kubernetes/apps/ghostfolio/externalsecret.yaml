apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghostfolio-secrets
  namespace: ghostfolio
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: ghostfolio-secrets
    template:
      data:
        POSTGRES_PASSWORD: "{{ .POSTGRES_PASSWORD }}"
        REDIS_PASSWORD: "{{ .REDIS_PASSWORD }}"
        ACCESS_TOKEN_SALT: "{{ .ACCESS_TOKEN_SALT }}"
        JWT_SECRET_KEY: "{{ .JWT_SECRET_KEY }}"
        DATABASE_URL: "postgresql://ghostfolio:{{ .POSTGRES_PASSWORD }}@ghostfolio-postgres:5432/ghostfolio-db?connect_timeout=300"
  dataFrom:
    - extract:
        key: <item-id>  # Ghostfolio - talos-home in Server Infrastructure vault
