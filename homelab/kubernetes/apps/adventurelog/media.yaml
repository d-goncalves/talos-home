# Serves uploaded images, because Django refuses to serve MEDIA_URL once DEBUG
# is off. Without this, turning DEBUG off turns every photo into a 404.
# /static needs no equivalent — WhiteNoise already handles it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adventurelog-media
  namespace: adventurelog
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: adventurelog-media
  template:
    metadata:
      labels:
        app: adventurelog-media
    spec:
      securityContext:
        # /code/media is mode 2770 owned 977:988, so "others" cannot traverse
        # it. NFS ignores fsGroup but honours supplementalGroups.
        runAsUser: 977
        runAsGroup: 988
        fsGroup: 988
        supplementalGroups: [988]
      containers:
        - name: nginx
          # Unprivileged image: listens on 8080, temp paths under /tmp.
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: media
              # Requests arrive as /media/<path> and nginx's root is
              # /usr/share/nginx/html, hence the mount path.
              mountPath: /usr/share/nginx/html/media
              readOnly: true
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          readinessProbe:
            # Probes the image's own index page, not /media/. That is a
            # directory, and with autoindex off nginx answers 403 — correct
            # behaviour, but it reads as an unhealthy pod forever.
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: adventurelog-media
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: adventurelog-media
  namespace: adventurelog
spec:
  selector:
    app: adventurelog-media
  ports:
    - name: http
      port: 8080
      targetPort: 8080
