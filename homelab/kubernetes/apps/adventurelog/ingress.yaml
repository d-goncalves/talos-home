apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adventurelog
  namespace: adventurelog
  annotations:
    tailscale.com/funnel: "false"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "AdventureLog"
    gethomepage.dev/description: "Travel tracker"
    gethomepage.dev/group: "Productivity"
    gethomepage.dev/icon: "adventurelog"
    gethomepage.dev/href: "https://adventurelog.${TAILNET_DOMAIN}"
    gethomepage.dev/pod-selector: "app=adventurelog-frontend"
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          # Uploaded images: the frontend proxies only /api and /auth, so a
          # stored photo returned a SvelteKit 404. Served by a small nginx
          # rather than the backend, because Django will not serve MEDIA_URL
          # once DEBUG is off. Must stay ahead of the catch-all.
          - path: /media
            pathType: Prefix
            backend:
              service:
                name: adventurelog-media
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: adventurelog-frontend
                port:
                  number: 3000
  tls:
    - hosts:
        - adventurelog
