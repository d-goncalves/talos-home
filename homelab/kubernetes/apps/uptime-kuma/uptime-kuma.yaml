apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uptime-kuma-data
  namespace: uptime-kuma
spec:
  storageClassName: nfs-uptime-kuma
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: uptime-kuma
  template:
    metadata:
      labels:
        app: uptime-kuma
    spec:
      # The NAS squashes every write to this uid/gid, and its entrypoint only
      # chowns /app/data when it is running as root. As root the chown is
      # attempted, denied by the squash, and the container exits:
      #   chown: changing ownership of '/app/data/kuma.db': Operation not permitted
      # Running as the squash owner skips that branch, and the files already
      # have the right ownership so nothing needs changing.
      # No runAsUser here on purpose. The entrypoint starts as root, chowns
      # /app/data to PUID:PGID, then drops to that user with setpriv. Forcing a
      # non-root uid makes setpriv fail ("setgroups: Operation not permitted").
      # Root is squashed to the same uid on this NFS export anyway, so the
      # chown below is a no-op rather than a privileged write.
      containers:
        - name: uptime-kuma
          # v2 aggregates the heartbeat table into a new format on first
          # start. That migration must not be interrupted — an interrupted run
          # means restoring from backup and retrying — so there are deliberately
          # no liveness or readiness probes on this Deployment to kill it
          # mid-flight, and the memory limit below is sized for the migration
          # rather than for steady state.
          image: louislam/uptime-kuma:2.5.4
          ports:
            - containerPort: 3001
          env:
            - name: TZ
              value: Europe/Lisbon
            # The entrypoint chowns /app/data to PUID:PGID, which default to
            # root. On NFS that is squashed and denied, so the container dies.
            # Pointing them at the owner the NAS already assigns makes the
            # chown a no-op instead of a privileged operation.
            - name: PUID
              value: "977"
            - name: PGID
              value: "988"
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              # v2 settles at ~181Mi, up from ~139Mi on v1.
              memory: 192Mi
            # Not back to the old 256Mi: v2 idles at ~181Mi, so that would
            # leave 75Mi of headroom on an app that periodically re-aggregates.
            # 1Gi was for the one-off migration; 512Mi is the steady state.
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: uptime-kuma-data
---
apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
spec:
  selector:
    app: uptime-kuma
  ports:
    - port: 3001
