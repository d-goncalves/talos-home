apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homebox-data-nfs
  namespace: homebox
spec:
  storageClassName: nfs-homebox
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homebox
  namespace: homebox
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homebox
  template:
    metadata:
      labels:
        app: homebox
    spec:
      containers:
        - name: homebox
          image: ghcr.io/sysadminsmedia/homebox:0.26.2
          ports:
            - containerPort: 7745
          env:
            - name: TZ
              value: Europe/Lisbon
            - name: HBOX_OPTIONS_ALLOW_REGISTRATION
              value: "false"
            # Required since the image started enforcing a >=32 byte pepper.
            # Without it the process panics on boot, which is what had homebox
            # crash-looping ~12 times an hour and leaking a containerd-shim
            # each time.
            - name: HBOX_AUTH_API_KEY_PEPPER
              valueFrom:
                secretKeyRef:
                  name: homebox-secret
                  key: api_key_pepper
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: homebox-data-nfs
---
apiVersion: v1
kind: Service
metadata:
  name: homebox
  namespace: homebox
spec:
  selector:
    app: homebox
  ports:
    - port: 7745
